
name: Build SHQIPONJA APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check AndroidManifest
        run: |
          echo "Kontrolli i AndroidManifest.xml"
          cat -n app/src/main/AndroidManifest.xml
          xmllint --noout app/src/main/AndroidManifest.xml

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SHQIPONJA-APK
          path: app/build/outputs/apk/debug/app-debug.apk
